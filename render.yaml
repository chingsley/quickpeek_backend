# Render Blueprint — QuickPeek staging stack.
# Creates three resources in one shot: the API web service, a Postgres
# database, and a Key Value (Redis-compatible) instance.
#
# Deploy: Render dashboard → New → Blueprint → point at THIS repository
# (chingsley/quickpeek). After the first deploy, fill in the env vars marked
# `sync: false` (Render prompts for them) — the STAGING.md runbook (workspace
# root) explains where to get each value.
services:
  - type: web
    name: quickpeek-api
    runtime: node
    plan: free
    # devDependencies are required: the build uses `tsc` and the start
    # command runs `prisma migrate deploy`, both of which are dev deps.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migrate:deploy && node dist/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quickpeek-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: quickpeek-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUND
        value: '10'
      - key: QUESTION_DRAFT_TTL_HOURS
        value: '24'
      # ── Fill these in the Render dashboard after the blueprint applies ──
      # Public URL of this API itself, e.g. https://quickpeek-api.onrender.com
      # (used for Stripe onboarding return/refresh URLs and socket CORS).
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

  - type: keyvalue
    name: quickpeek-redis
    plan: free
    # Queues must not lose jobs to LRU eviction.
    maxmemoryPolicy: noeviction
    # Internal-only: only the web service above can connect.
    ipAllowList: []

databases:
  - name: quickpeek-db
    plan: free
    databaseName: quickpeek
    user: quickpeek
